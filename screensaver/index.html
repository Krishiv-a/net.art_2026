<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hala Madrid Screensaver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="ball-clip"><circle r="47"/></clipPath>
    <symbol id="football" viewBox="-50 -50 100 100">
      <circle r="47" fill="#fff"/>
      <g clip-path="url(#ball-clip)" fill="#14121f" stroke="#14121f" stroke-width="2" stroke-linejoin="round">
        <polygon points="0,-15 14.3,-4.6 8.8,12.1 -8.8,12.1 -14.3,-4.6"/>
        <polygon points="0,-27 -13.3,-36.7 -8.2,-52.3 8.2,-52.3 13.3,-36.7"/>
        <polygon points="25.7,-8.3 30.8,-24 47.2,-24 52.3,-8.3 39,1.3"/>
        <polygon points="15.9,21.8 32.3,21.8 37.4,37.5 24.1,47.2 10.8,37.5"/>
        <polygon points="-15.9,21.8 -10.8,37.5 -24.1,47.2 -37.4,37.5 -32.3,21.8"/>
        <polygon points="-25.7,-8.3 -39,1.3 -52.3,-8.3 -47.2,-24 -30.8,-24"/>
        <path fill="none" d="M0 -15V-27M14.3 -4.6L25.7 -8.3M8.8 12.1L15.9 21.8M-8.8 12.1L-15.9 21.8M-14.3 -4.6L-25.7 -8.3M13.3 -36.7L30.8 -24M39 1.3L32.3 21.8M10.8 37.5H-10.8M-32.3 21.8L-39 1.3M-30.8 -24L-13.3 -36.7"/>
      </g>
      <circle r="47" fill="none" stroke="#c9c6d6" stroke-width="1.5"/>
    </symbol>
  </defs>
</svg>

<main class="screen">
  <input type="radio" name="kit" id="home" checked>
  <input type="radio" name="kit" id="away">
  <input type="radio" name="kit" id="noche">
  <button class="turbo" type="button">CONTRAATAQUE</button>

  <div class="stage">
    <div class="stars"></div>
    <div class="chant"><span>HALA MADRID</span><span>HALA MADRID</span><span>HALA MADRID</span><span>HALA MADRID</span></div>
    <div class="pitch"></div>
    <div class="speedlines"></div>
    <div class="beam left"></div>
    <div class="beam right"></div>
    <div class="lamp left"></div>
    <div class="lamp right"></div>
    <div class="orbs">
      <div class="x"><div class="y"><div class="ball"><svg><use href="#football"/></svg></div></div></div>
      <div class="x"><div class="y"><div class="ball"><svg><use href="#football"/></svg></div></div></div>
      <div class="x"><div class="y"><div class="ball"><svg><use href="#football"/></svg></div></div></div>
      <div class="x"><div class="y"><div class="ball"><svg><use href="#football"/></svg></div></div></div>
      <div class="x"><div class="y"><div class="ball"><svg><use href="#football"/></svg></div></div></div>
    </div>
  </div>

  <p class="goal">GOOOL!</p>

  <div class="idle">
    <h1>HALA <span>MADRID</span></h1>
    <p>Hover for kickoff &middot; hold click to score &middot; contraataque for speed</p>
  </div>

  <nav class="controls">
    <label for="home">HOME</label>
    <label for="away">AWAY</label>
    <label for="noche">NOCHE</label>
  </nav>
</main>
</body>
</html>
